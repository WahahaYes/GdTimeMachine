# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: fix-byte-order-marker

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
        verbose: true

  # GDScript formatting
  - repo: local
    hooks:
      - id: gdformat
        name: GDScript format
        entry: gdformat
        language: python
        types: [gdscript]
        require_serial: true
        additional_dependencies: ["gdtoolkit"]

# Markdown formatting
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.19
    hooks:
      - id: mdformat
        args: ["--wrap=no"]
        types: [markdown]

  # Documentation drift check (README/LICENSE between root and addon)
  - repo: local
    hooks:
      - id: check-docs
        name: Check README/LICENSE drift (via make)
        entry: make check-docs
        language: system
        files: ^(README\.md|LICENSE\.txt|addons/gd-time-machine/(README\.md|LICENSE\.txt))$
        require_serial: true
        pass_filenames: false

# Configuration
default_install_hook_types: [pre-commit, pre-push]
fail_fast: false
